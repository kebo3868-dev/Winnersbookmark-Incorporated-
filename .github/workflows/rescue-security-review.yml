name: Rescue security remediation verification
on:
  push:
    branches: ['remediation/rescue-security-blockers-2026-11-03']
    paths-ignore: ['reports/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: rescue-agent
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_PASSWORD: disposable-rescue-test
          POSTGRES_DB: rescue_remediation
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:disposable-rescue-test@127.0.0.1:5432/rescue_remediation
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rescue-agent/package-lock.json
      - name: Verify baseline ancestry and isolated build storage
        run: |
          mkdir -p .review
          git fetch --no-tags origin 969740c2655b064399e0cb4b8d514e9112145c8d
          git merge-base --is-ancestor 969740c2655b064399e0cb4b8d514e9112145c8d HEAD
          df -h | tee .review/storage.txt
          test "$(df -Pk . | awk 'NR==2 {print $4}')" -ge 12582912
          docker info > .review/docker-info.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2 --testTimeout=30000
      - run: npm audit --json > .review/audit-all.json
      - run: npm audit --omit=dev --json > .review/audit-production.json
      - run: npm run db:deploy
      - run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npx vitest run --config tests-integration/security.config.mts
      - name: Reproduce original blockers and compare rendered reports to exact baseline
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          mkdir -p /tmp/rescue-baseline
          git -C .. archive 969740c2655b064399e0cb4b8d514e9112145c8d | tar -x -C /tmp/rescue-baseline
          ln -s "$PWD/node_modules" /tmp/rescue-baseline/rescue-agent/node_modules
          ln -s "$PWD/node_modules" /tmp/rescue-baseline/reports/node_modules
          RESCUE_BASELINE_SOURCE=/tmp/rescue-baseline/rescue-agent npx vitest run --config tests-integration/baseline.config.mts
          (cd /tmp/rescue-baseline/rescue-agent && REPORT_PHASE=security-baseline node_modules/.bin/vitest run --config ../reports/dependency-remediation/verify.config.mts ../reports/dependency-remediation/preservation.test.ts)
          ln -s "$PWD/node_modules" ../reports/node_modules
          npm install --prefix /tmp/rescue-oracle zod3@npm:zod@3.25.76
          REPORT_PHASE=security-final REPORT_REFERENCE_PHASE=/tmp/rescue-baseline/reports/dependency-remediation/security-baseline ZOD3_REFERENCE=/tmp/rescue-oracle/node_modules/zod3 npx vitest run --config ../reports/dependency-remediation/verify.config.mts
      - run: npm run build
      - name: Browser E2E against disposable database
        run: |
          npm install --prefix /tmp/rescue-browser @playwright/test@1.64.1
          ln -s /tmp/rescue-browser/node_modules/@playwright node_modules/@playwright
          /tmp/rescue-browser/node_modules/.bin/playwright install --with-deps chromium
          export BASIC_AUTH_USER=operator BASIC_AUTH_PASSWORD=local-verification-operator-password FRONTDESK_TRUSTED_SOURCE_HEADER=x-test-source FRONTDESK_THROTTLE_SECRET=stable-disposable-verification-key-not-for-production
          npm start > .review/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 60); do curl -fsS http://localhost:3000/api/health && break || sleep 1; done
          PW_CHROMIUM="$(find /home/runner/.cache/ms-playwright -path '*/chrome-linux64/chrome' -o -path '*/chrome-linux/chrome' | head -1)" E2E_USER="$BASIC_AUTH_USER" E2E_PASS="$BASIC_AUTH_PASSWORD" /tmp/rescue-browser/node_modules/.bin/playwright test
      - name: Build actual application and locked migrator images
        run: |
          docker build --progress=plain -t rescue-remediation:final . 2>&1 | tee .review/docker-build.log
          docker build --progress=plain --target migrator -t rescue-remediation:migrator . 2>&1 | tee .review/docker-migrator-build.log
          docker image inspect rescue-remediation:final rescue-remediation:migrator > .review/images.json
      - name: Audit installed image packages and exercise native Sharp/Next AVIF
        run: |
          docker run --rm -i -e RUNTIME_AUDIT_EXPORT=1 --entrypoint node rescue-remediation:final - /app < scripts/audit-runtime.mjs > .review/image-app-closure.json 2> .review/image-app-inventory.json
          docker run --rm -i -e RUNTIME_AUDIT_EXPORT=1 --entrypoint node rescue-remediation:migrator - /app/migrator < scripts/audit-runtime.mjs > .review/image-migrator-closure.json 2> .review/image-migrator-inventory.json
          RUNTIME_AUDIT_IMPORT=1 node scripts/audit-runtime.mjs < .review/image-app-closure.json > .review/audit-image-app.json
          RUNTIME_AUDIT_IMPORT=1 node scripts/audit-runtime.mjs < .review/image-migrator-closure.json > .review/audit-image-migrator.json
          docker run --rm --entrypoint sh rescue-remediation:final -c '! command -v npm && ! command -v yarn && ! command -v corepack'
          docker run --rm --entrypoint sh rescue-remediation:migrator -c '! command -v npm && ! command -v yarn && ! command -v corepack'
          docker run --rm --entrypoint dpkg-query rescue-remediation:final -W '-f=${Package}\t${Version}\n' > .review/image-os-packages.tsv
          docker run --rm -i --entrypoint node rescue-remediation:final - /app < scripts/verify-standalone.mjs > .review/image-sharp.json
          docker run --rm --add-host host.docker.internal:host-gateway --entrypoint /app/migrator/node_modules/.bin/prisma -e DATABASE_URL=postgresql://postgres:disposable-rescue-test@host.docker.internal:5432/rescue_remediation rescue-remediation:final migrate deploy --schema=/app/prisma/schema.prisma > .review/image-migrations.log
          docker run --rm --add-host host.docker.internal:host-gateway --mount "type=bind,src=$PWD/prisma,dst=/schema,readonly" --entrypoint node -e DATABASE_URL=postgresql://postgres:disposable-rescue-test@host.docker.internal:5432/rescue_remediation rescue-remediation:migrator node_modules/prisma/build/index.js migrate deploy --schema=/schema/schema.prisma > .review/migrator-image-migrations.log
      - name: Start the final image with its real non-root entrypoint
        run: |
          docker run -d --name rescue-image-verification --add-host host.docker.internal:host-gateway -p 127.0.0.1:3001:3000 \
            -e DATABASE_URL=postgresql://postgres:disposable-rescue-test@host.docker.internal:5432/rescue_remediation \
            -e BASIC_AUTH_USER=operator -e BASIC_AUTH_PASSWORD=local-verification-operator-password \
            -e FRONTDESK_TRUSTED_SOURCE_HEADER=x-test-source \
            -e FRONTDESK_THROTTLE_SECRET=stable-disposable-verification-key-not-for-production \
            rescue-remediation:final
          trap 'docker logs rescue-image-verification > .review/image-server.log 2>&1; docker rm -f rescue-image-verification' EXIT
          for attempt in $(seq 1 60); do curl -fsS http://localhost:3001/api/health > .review/image-health.json && break || sleep 1; done
          node -e 'const a=require("./.review/image-health.json"); if(a.status!=="ok"||a.database!=="up") process.exit(1)'
          curl -fsS -H 'x-test-source: 192.0.2.7' --json '{"email":"owner@example.invalid","password":"valid-disposable-password"}' http://localhost:3001/api/frontdesk/auth/login > .review/image-login.json
          node -e 'const a=require("./.review/image-login.json"); if(!a.ok||a.role!=="WBI_ADMIN"||a.tenantId!==null) process.exit(1)'
          docker exec rescue-image-verification node -e 'const {Prisma}=require("@prisma/client");const audit=Prisma.dmmf.datamodel.models.find(m=>m.name==="FdAuditLog");if(!audit.fields.some(f=>f.name==="dedupeKey"))process.exit(1);console.log(JSON.stringify({auditFields:audit.fields.map(f=>f.name),securityBucket:Prisma.dmmf.datamodel.models.some(m=>m.name==="FdSecurityBucket")}))' > .review/image-client-schema.json
      - name: Scan final application and migrator images (all OS and package findings)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.review:/reports" aquasec/trivy:0.67.2 image --format json --output /reports/trivy-app.json rescue-remediation:final
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.review:/reports" aquasec/trivy:0.67.2 image --format json --output /reports/trivy-migrator.json rescue-remediation:migrator
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rescue-security-verification-${{ github.sha }}
          path: rescue-agent/.review/
          include-hidden-files: true
          retention-days: 7
