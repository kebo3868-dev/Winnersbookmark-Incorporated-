# Self-hosted / staging deployment: app + PostgreSQL on one host.
# Copy .env.example to .env and fill in values before `docker compose up -d`.
services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://rescue:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/rescue_agent
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?set BASIC_AUTH_USER in .env}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:?set BASIC_AUTH_PASSWORD in .env}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rescue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rescue_agent
    volumes:
      - rescue_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rescue -d rescue_agent']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  rescue_pgdata:
